<!-- Client-owned dedup id — one per pageview, shared across all pixels, independent of Jitsu.
     Fired synchronously so pixels never wait on (or fail with) Jitsu. -->
<script>
(function () {
  window.dataLayer = window.dataLayer || [];
  window.SFERE_EID = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : 'x-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  window.dataLayer.push({ event: 'sfere_pageview', sfere_event_id: window.SFERE_EID });
})();
</script>

<!-- Jitsu onload callback: let Jitsu manage its OWN natively-persisted anonymous id
     (cookie __eventn_id). Per Jitsu docs we do NOT call setAnonymousId; we only READ the id
     for advanced matching, and send our dedup id to Jitsu as an event property. -->
<script>
window.initSfere = function (jitsu) {
  window.dataLayer = window.dataLayer || [];
  try {
    var u = jitsu.user() || {};
    window.dataLayer.push({
      event: 'jitsu_ready',
      jitsu_anonymous_id: u.anonymousId || '',
      jitsu_user_id: u.id || ''
    });
    jitsu.track("PAGEVIEW", { sfere_event_id: window.SFERE_EID });
  } catch (e) {}
};
</script>
